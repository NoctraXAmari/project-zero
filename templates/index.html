<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Zero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, sans-serif;
    background: #0a0a0f;
    color: #e8e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #13131a;
    border: 1px solid #1f1f2e;
    border-radius: 16px;
    padding: 40px 28px;
    text-align: center;
  }
  h1 { font-size: 32px; margin-bottom: 8px; }
  p { color: #8a8a9a; margin-bottom: 32px; font-size: 14px; }
  .btn {
    display: block;
    background: #5865F2;
    color: white;
    text-decoration: none;
    padding: 14px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
  }
  .btn:hover { background: #4752c4; }
</style>
</head>
<body>
  <div class="card">
    <h1>Project Zero</h1>
    <p>Roblox utility dashboard</p>
    <a href="/login" class="btn">Continue with Discord</a>
  </div>
</body>
</html>
